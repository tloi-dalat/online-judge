name: 'analyze'
on:
  pull_request:
    branches: [main, release, 'releases/**']
  push:
    branches: [main, release]
  schedule:
    - cron: '43 2 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  codeql:
    name: codeql
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: tloi-dalat/reusable-workflow/.github/workflows/codeql.yaml@main
    with:
      queries: security-and-quality
      paths-ignore: |
        resources/mathjax
        martor/static/plugins
        resources/libs
        resources/vnoj
        static
        node_modules
