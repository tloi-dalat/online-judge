name: 'workflow'
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: workflow-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    permissions:
      contents: read
      packages: write
    uses: tloi-dalat/reusable-workflow/.github/workflows/build-push.yaml@main
    with:
      image: oj-core
      dockerfile: Dockerfile
      submodules: recursive
      push: ${{ github.event_name != 'pull_request' }}

  wsevent:
    permissions:
      contents: read
      packages: write
    uses: tloi-dalat/reusable-workflow/.github/workflows/build-push.yaml@main
    with:
      image: oj-wsevent
      dockerfile: websocket/Dockerfile
      push: ${{ github.event_name != 'pull_request' }}

  deploy-dev:
    if: github.ref == 'refs/heads/main'
    needs: [core, wsevent]
    permissions:
      contents: read
    uses: tloi-dalat/reusable-workflow/.github/workflows/dispatch.yaml@main
    with:
      apps: core,wsevent
      namespace: online-judge
      environment: development
      version: ${{ needs.core.outputs.version }}
    secrets: inherit

  production-values:
    if: github.ref_type == 'tag'
    needs: [core, wsevent]
    permissions:
      contents: write
    uses: tloi-dalat/reusable-workflow/.github/workflows/production-values.yaml@main
    with:
      apps: core,wsevent
      images: oj-core,oj-wsevent
      namespace: online-judge
      version: ${{ needs.core.outputs.version }}
