name: 'workflow'
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: workflow-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    permissions:
      contents: read
      packages: write
    uses: tloi-dalat/reusable-workflow/.github/workflows/build-push.yaml@main
    with:
      image: online-judge-site
      dockerfile: Dockerfile
      submodules: recursive
      push: ${{ github.event_name != 'pull_request' }}

  event:
    permissions:
      contents: read
      packages: write
    uses: tloi-dalat/reusable-workflow/.github/workflows/build-push.yaml@main
    with:
      image: online-judge-event
      dockerfile: websocket/Dockerfile
      push: ${{ github.event_name != 'pull_request' }}

  deploy-dev:
    if: github.ref == 'refs/heads/main'
    needs: [site, event]
    permissions:
      contents: read
    uses: tloi-dalat/reusable-workflow/.github/workflows/dispatch.yaml@main
    with:
      apps: site,event
      namespace: online-judge
      environment: development
      version: ${{ needs.site.outputs.version }}
    secrets: inherit

  production-values:
    if: github.ref_type == 'tag'
    needs: [site, event]
    permissions:
      contents: write
    uses: tloi-dalat/reusable-workflow/.github/workflows/production-values.yaml@main
    with:
      apps: site,event
      images: online-judge-site,online-judge-event
      namespace: online-judge
      version: ${{ needs.site.outputs.version }}
