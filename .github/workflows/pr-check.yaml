name: 'check'
on:
  pull_request:
    branches: [main, release, 'releases/**']
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-check-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  title:
    name: check-title
    permissions: {}
    uses: tloi-dalat/reusable-workflow/.github/workflows/pr-title-check.yaml@main

  source:
    name: check-source
    permissions: {}
    uses: tloi-dalat/reusable-workflow/.github/workflows/pr-source-check.yaml@main
